<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Digital Archive</title><style>body{font-family:system-ui;background:#f4f7fb;margin:0;color:#172033}main{max-width:950px;margin:auto;padding:30px}.hero,.card{background:white;padding:24px;border-radius:20px;margin:15px 0}.hero{background:#18243b;color:white}.import{display:inline-block;background:white;color:#18243b;padding:12px;border-radius:10px}.import input{display:none}input,select,button{padding:10px;border:1px solid #d4dbe7;border-radius:9px}.toolbar{display:flex;gap:10px}.item{display:flex;gap:15px;align-items:center}.icon{width:55px;height:55px;border-radius:12px;background:#e9eef8;display:grid;place-items:center;font-weight:bold}.item div:nth-child(2){flex:1}.item p{color:#64748b}.actions button{margin:3px}@media(max-width:600px){.toolbar{flex-direction:column}.item{align-items:flex-start}.actions{display:flex;flex-direction:column}}</style><main><div class="hero"><h1>Digital Archive</h1><p>Import, organize and search your personal archive.</p><label class="import">＋ Import files<input id="files" type="file" multiple accept=".pdf,.doc,.docx,image/*"></label></div><div class="card"><div class="toolbar"><input id="search" placeholder="Search filename or tag"><select id="filter"><option value="">All types</option></select></div></div><div id="list"></div></main><script>let data=JSON.parse(localStorage.archive||'[]');const list=document.querySelector('#list');function save(){localStorage.archive=JSON.stringify(data)}function render(){let q=search.value.toLowerCase(),f=filter.value;list.innerHTML=data.filter(x=>(x.name.toLowerCase().includes(q)||x.tag.toLowerCase().includes(q))&&(!f||x.type===f)).map(x=>'<div class="card item"><div class="icon">'+(x.type.includes('pdf')?'PDF':x.type.startsWith('image')?'IMG':'DOC')+'</div><div><b>'+x.name+'</b><p>'+Math.round(x.size/1024)+' KB · '+new Date(x.imported).toLocaleDateString()+'</p><small>AVAILABLE · '+x.tag+'</small></div><div class="actions"><button onclick="renameE(\''+x.id+'\')">Rename</button><button onclick="removeE(\''+x.id+'\')">Remove entry</button></div></div>').join('')||'<div class="card">No archive records.</div>'}files.onchange=()=>{[...files.files].forEach(f=>data.unshift({id:crypto.randomUUID(),name:f.name,type:f.type||'unknown',size:f.size,imported:new Date().toISOString(),modified:new Date(f.lastModified).toISOString(),tag:'Unsorted',status:'AVAILABLE'}));save();render()};search.oninput=render;filter.onchange=render;function renameE(id){let n=prompt('New name');if(n){data=data.map(x=>x.id===id?{...x,name:n}:x);save();render()}}function removeE(id){data=data.filter(x=>x.id!==id);save();render()}render();</script>
